<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'IBM Plex Sans', Arial, sans-serif">
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#161a1e">Two-Stage Retrieval: Recall, Then Precision</text>
  <text x="460" y="62" text-anchor="middle" font-size="13.5" fill="#63696e">A cheap bi-encoder narrows the field; an expensive cross-encoder ranks what's left</text>

  <!-- Funnel shape -->
  <polygon points="70,100 850,100 620,240 300,240" fill="#f7f8f5" stroke="#d8dbd3" stroke-width="1.5"/>
  <polygon points="300,240 620,240 540,340 380,340" fill="#f1e3d1" stroke="#a8631f" stroke-width="1.5"/>

  <!-- Stage 1 label -->
  <text x="460" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#a8631f">STAGE 1 — bi-encoder vector search</text>
  <text x="460" y="150" text-anchor="middle" font-size="12" fill="#3d4a44">cheap, approximate — compares independent embeddings</text>
  <text x="150" y="90" text-anchor="middle" font-size="12.5" fill="#161a1e" font-weight="600">~1,000,000 documents</text>
  <text x="770" y="90" text-anchor="middle" font-size="12.5" fill="#161a1e" font-weight="600">in the collection</text>

  <text x="460" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#161a1e">top 100 candidates</text>

  <!-- Stage 2 label -->
  <text x="460" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#5c3610">STAGE 2 — cross-encoder rerank</text>
  <text x="460" y="288" text-anchor="middle" font-size="12" fill="#5c3610">expensive, precise — scores query + document jointly</text>

  <text x="460" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#5c3610">top 10 → sent to the LLM</text>

  <!-- output arrow -->
  <path d="M460 340 L 460 372" stroke="#a8631f" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="380" y="376" width="160" height="34" rx="7" fill="#eceee8" stroke="#8d9490"/>
  <text x="460" y="398" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161a1e">LLM context window</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a8631f"/>
    </marker>
  </defs>
</svg>
