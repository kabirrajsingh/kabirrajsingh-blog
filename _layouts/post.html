---
layout: default
---
<a class="back-link" href="{{ '/' | relative_url }}">&larr; all posts</a>
<article>
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
      <span class="read-time">{% assign words = content | strip_html | number_of_words %}{{ words | divided_by: 200 | at_least: 1 }} min read</span>
    </div>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
</article>
